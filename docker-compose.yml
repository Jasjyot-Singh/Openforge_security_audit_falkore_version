services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: shadowprint-falkordb
    ports:
      - "6379:6379"
    restart: unless-stopped
    environment:
      - FALKORDB_ARGS=--save ""
    volumes:
      - falkordb-data:/data
    networks:
      - shadowprint-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shadowprint-app
    ports:
      - "8080:8080"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - PYTHONUNBUFFERED=1
    depends_on:
      - falkordb
    restart: unless-stopped
    networks:
      - shadowprint-net

volumes:
  falkordb-data:

networks:
  shadowprint-net:
    driver: bridge
