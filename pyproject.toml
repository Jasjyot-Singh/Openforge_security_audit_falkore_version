[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowprint"
version = "0.1.0"
description = "MCP Server Security Auditor — Every server leaves a trace"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.3.0",
    "pydantic>=2.5.0",
    "typer[all]>=0.9.0",
    "rich>=13.7.0",
    "deepdiff>=8.0.0",
    "bandit>=1.7.8",
    "ollama>=0.4.0",
    "requests>=2.31.0",
    "sarif-om>=1.0.4",
    "falkordb>=1.8.0",
]

[project.scripts]
shadowprint = "shadowprint.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["shadowprint*"]
